<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahagita Player</title>

<!-- PWA / iOS home-screen app behavior -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c8722a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahagita">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<!-- Warm up the connection to Osho's server as soon as the app opens, so
     the DNS/TCP/TLS handshake is already done by the time you tap an
     episode — shaves a real chunk off the "why is this slow to start"
     delay, without downloading anything. -->
<link rel="preconnect" href="https://oshoworld.com">
<link rel="dns-prefetch" href="https://oshoworld.com">

<style>
  :root{
    --ink:#2b2420;
    --ink-soft:#6b5e54;
    --paper:#f7f1e6;
    --paper-raised:#fffdf8;
    --line:#e2d5c0;
    --saffron:#c8722a;
    --saffron-soft:#e9c9a0;
    --saffron-deep:#9a4f16;
    --track:#e6dac2;
    --danger:#b3452f;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f0e6d8;
      --ink-soft:#b9a998;
      --paper:#1c1712;
      --paper-raised:#26201a;
      --line:#3a2f24;
      --saffron:#e08a3e;
      --saffron-soft:#4a3420;
      --saffron-deep:#f3a662;
      --track:#332a20;
      --danger:#e07a5f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f0e6d8;
    --ink-soft:#b9a998;
    --paper:#1c1712;
    --paper-raised:#26201a;
    --line:#3a2f24;
    --saffron:#e08a3e;
    --saffron-soft:#4a3420;
    --saffron-deep:#f3a662;
    --track:#332a20;
    --danger:#e07a5f;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html, body{ height:100%; margin:0; }
  [hidden]{ display:none !important; }
  img{ max-width:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  h1,h2,.serif{
    font-family:'Fraunces', Georgia, 'Times New Roman', serif;
  }

  header{
    padding:18px 20px 14px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-shrink:0;
  }
  header .title{
    font-size:1.35rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  header .title .sub{
    display:block;
    font-family:'Source Sans 3', sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-top:3px;
  }
  #jumpBtn{
    border:1px solid var(--saffron);
    background:transparent;
    color:var(--saffron-deep);
    font-family:'Source Sans 3', sans-serif;
    font-size:0.82rem;
    font-weight:600;
    padding:8px 14px;
    border-radius:99px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  #jumpBtn:active{ background:var(--saffron-soft); }

  main{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:110px;
  }

  #net-note{
    margin:12px 16px 0;
    padding:10px 14px;
    background:var(--saffron-soft);
    color:var(--saffron-deep);
    border-radius:10px;
    font-size:0.78rem;
    line-height:1.45;
    display:none;
  }
  #net-note.show{ display:block; }

  #progress-wrap{
    padding:14px 20px 4px;
  }
  #progress-label{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  #progress-bar-outer{
    height:5px;
    background:var(--track);
    border-radius:99px;
    overflow:hidden;
  }
  #progress-bar-inner{
    height:100%;
    background:var(--saffron);
    width:0%;
    transition:width 0.2s;
  }

  ul#list{
    list-style:none;
    margin:0;
    padding:6px 10px 0;
  }
  li.ep{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-radius:12px;
    cursor:pointer;
    border:1px solid transparent;
    scroll-margin:16px;
  }
  li.ep:active{ background:var(--paper-raised); }
  li.ep.playing{
    background:var(--paper-raised);
    border-color:var(--saffron-soft);
  }
  .ep-num{
    font-family:'Fraunces', serif;
    font-size:0.92rem;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--saffron-soft);
    color:var(--saffron-deep);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-variant-numeric: tabular-nums;
  }
  li.ep.playing .ep-num{
    background:var(--saffron);
    color:var(--paper-raised);
  }
  .ep-num svg{ width:18px; height:18px; }
  .ep-body{
    flex:1;
    min-width:0;
  }
  .ep-name{
    font-size:0.92rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ep-meta{
    font-size:0.74rem;
    color:var(--ink-soft);
    margin-top:2px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .ep-meta .mini-track{
    width:60px;height:3px;background:var(--track);border-radius:99px;overflow:hidden;flex-shrink:0;
  }
  .ep-meta .mini-fill{
    height:100%;background:var(--saffron);
  }
  .ep-meta .done{ color:var(--saffron-deep); font-weight:600; }

  #player{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display:none;
    flex-direction:column;
    gap:8px;
  }
  #player.show{ display:flex; }
  #player-top{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #player-title{
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:0.88rem;
    font-weight:600;
  }
  #player-time{
    font-size:0.74rem;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
  }
  #seek{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:99px;
    background:var(--track);
    outline:none;
    margin:0;
  }
  #seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--saffron);
    cursor:pointer;
  }
  #seek::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:var(--saffron);
    border:none;
    cursor:pointer;
  }
  #controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
  }
  #controls button{
    background:none;
    border:none;
    color:var(--ink);
    cursor:pointer;
    padding:4px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #playPause{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--saffron);
    color:var(--paper-raised);
  }
  #playPause svg{ width:22px;height:22px; }
  .skip svg{ width:24px;height:24px; }
  .rate-btn{
    font-size:0.78rem;
    font-weight:700;
    border:1px solid var(--line);
    border-radius:99px;
    padding:4px 9px;
    color:var(--ink-soft);
    min-width:44px;
  }

  .sr-only{
    position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinning{ animation:spin 0.9s linear infinite; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="title">Mahagita
    <span class="sub">Ashtavakra · Osho</span>
  </div>
  <button id="jumpBtn">Resume</button>
</header>

<div id="net-note">You're offline right now, so streaming won't work until you're back on wifi or cellular data.</div>

<div id="progress-wrap">
  <div id="progress-label"><span id="progress-count"></span><span id="progress-pct"></span></div>
  <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
</div>

<main>
  <ul id="list"></ul>
</main>

<div id="player">
  <div id="player-top">
    <div id="player-title">—</div>
    <div id="player-time">0:00 / 0:00</div>
  </div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div id="controls">
    <button class="rate-btn" id="rateBtn">1.0×</button>
    <button class="skip" id="backBtn" aria-label="Back 15 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button id="playPause" aria-label="Play">
      <svg id="loadIcon" class="spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M12 3a9 9 0 1 1-9 9"/></svg>
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>
    <button class="skip" id="fwdBtn" aria-label="Forward 30 seconds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
    </button>
    <div style="width:44px"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function(){
  "use strict";

  // ---------- episode catalog: streamed directly from Osho's own server ----------
  // Confirmed URL pattern (each supports HTTP range requests, so playback
  // streams rather than requiring a full download):
  // https://oshoworld.com/wp-content/uploads/2020/11/Hindi%20Audio/OSHO-Maha_Geeta_NN.mp3
  //
  // NOTE: their server does not send CORS headers, so a plain <audio src>
  // can stream/play these files fine (media playback never needed CORS),
  // but fetch() cannot read the bytes to store them locally — confirmed
  // directly (a fetch() to this host is rejected outright, and even
  // mode:"no-cors" only returns an unreadable opaque response). That rules
  // out any client-side "save for offline" or background pre-caching for
  // these specific files; there is no workaround without a server of our
  // own to proxy through. This app is streaming-only for that reason.
  var BASE_URL = "https://oshoworld.com/wp-content/uploads/2020/11/Hindi%20Audio/OSHO-Maha_Geeta_";
  var TOTAL_EPISODES = 91;

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }

  var episodes = [];
  for(var n = 1; n <= TOTAL_EPISODES; n++){
    var p = pad2(n);
    episodes.push({
      id: "ep-" + p,
      num: p,
      name: "Ashtavakra Maha Geeta " + p,
      url: BASE_URL + p + ".mp3",
      position: 0,
      duration: 0,
      done: false
    });
  }

  // ---------- register service worker for offline app-shell caching ----------
  // (this only caches the app's own same-origin files — the page, icons,
  // manifest — so it works fine even though caching the audio doesn't.)
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }

  // ---------- localStorage: tiny per-episode progress, not the audio itself ----------
  function lsGet(key, fallback){
    try{
      var v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    }catch(e){ return fallback; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  var progressMap = lsGet("mahagita:progress", {}); // { "ep-01": {position, duration, done} }
  episodes.forEach(function(ep){
    var p = progressMap[ep.id];
    if(p){
      ep.position = p.position || 0;
      ep.duration = p.duration || 0;
      ep.done = !!p.done;
    }
  });

  function saveProgress(ep){
    progressMap[ep.id] = { position: ep.position, duration: ep.duration, done: ep.done };
    lsSet("mahagita:progress", progressMap);
  }

  // ---------- state ----------
  var byId = {};
  episodes.forEach(function(ep){ byId[ep.id] = ep; });
  var currentId = lsGet("mahagita:lastPlayed", null);
  // currentId is restored from storage so the UI can highlight it and offer
  // "Resume" immediately, but that alone does NOT mean the audio element has
  // anything loaded yet. audioLoaded/loading track the real player state so
  // we don't confuse "this is the remembered episode" with "this is actually
  // in the player and ready to play" (that mismatch was the resume bug).
  var audioLoaded = false;
  var loading = false;
  var loadToken = 0;
  var rates = [1, 1.25, 1.5, 1.75, 2, 0.75];
  var rateIdx = lsGet("mahagita:rateIdx", 0);
  var saveTimer = null;

  var $list = document.getElementById("list");
  var $player = document.getElementById("player");
  var $audio = document.getElementById("audio");
  var $title = document.getElementById("player-title");
  var $time = document.getElementById("player-time");
  var $seek = document.getElementById("seek");
  var $playPause = document.getElementById("playPause");
  var $loadIcon = document.getElementById("loadIcon");
  var $playIcon = document.getElementById("playIcon");
  var $pauseIcon = document.getElementById("pauseIcon");
  var $rateBtn = document.getElementById("rateBtn");
  var $jumpBtn = document.getElementById("jumpBtn");
  var $progressCount = document.getElementById("progress-count");
  var $progressPct = document.getElementById("progress-pct");
  var $progressInner = document.getElementById("progress-bar-inner");
  var $netNote = document.getElementById("net-note");

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    var m = Math.floor(s/60);
    var sec = s%60;
    return m + ":" + (sec<10?"0":"") + sec;
  }

  // shows a spinner in the big play button while an episode is loading/buffering
  function setPlayButtonState(state){
    $loadIcon.style.display = state === "loading" ? "block" : "none";
    $playIcon.style.display = state === "play" ? "block" : "none";
    $pauseIcon.style.display = state === "pause" ? "block" : "none";
  }

  var spinnerSvg = '<svg class="spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';

  function render(){
    var html = "";
    for(var i=0;i<episodes.length;i++){
      var ep = episodes[i];
      var pct = ep.duration ? Math.min(100, (ep.position/ep.duration)*100) : 0;
      var isPlaying = ep.id === currentId;
      // Only show the loading state while a fetch is actually in flight —
      // NOT just because audioLoaded happens to be false, which is also
      // true for the ordinary "restored from storage, not yet tapped" state
      // right after opening the app (that state should show the normal
      // saved position, not a permanent "Loading…").
      var isLoadingRow = isPlaying && loading;
      var metaText;
      if(isLoadingRow){
        metaText = '<span>Loading…</span>';
      } else if(ep.done){
        metaText = '<span class="done">✓ Finished</span>';
      } else if(ep.position > 3){
        metaText = '<span class="mini-track"><span class="mini-fill" style="width:'+pct.toFixed(0)+'%"></span></span><span>'+fmtTime(ep.position)+'</span>';
      } else {
        metaText = '<span>Not started</span>';
      }
      var numContent = isLoadingRow ? spinnerSvg : (isPlaying ? '♫' : ep.num);

      html += '<li class="ep'+(isPlaying?' playing':'')+'" data-id="'+ep.id+'">'+
        '<div class="ep-num">'+numContent+'</div>'+
        '<div class="ep-body">'+
          '<div class="ep-name">'+ep.name+'</div>'+
          '<div class="ep-meta">'+metaText+'</div>'+
        '</div>'+
      '</li>';
    }
    $list.innerHTML = html;

    var finished = episodes.filter(function(e){return e.done;}).length;
    $progressCount.textContent = finished + " of " + episodes.length + " finished";
    $progressPct.textContent = Math.round((finished/episodes.length)*100) + "%";
    $progressInner.style.width = (finished/episodes.length*100) + "%";
  }

  function updateMediaSession(ep){
    if(!("mediaSession" in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ep.name,
        artist: "Ashtavakra Mahagita",
        album: "Osho"
      });
      navigator.mediaSession.setActionHandler("play", function(){ $audio.play().catch(function(){}); });
      navigator.mediaSession.setActionHandler("pause", function(){ $audio.pause(); });
      navigator.mediaSession.setActionHandler("seekbackward", function(){ $audio.currentTime = Math.max(0, $audio.currentTime - 15); });
      navigator.mediaSession.setActionHandler("seekforward", function(){ $audio.currentTime = Math.min($audio.duration || Infinity, $audio.currentTime + 30); });
      navigator.mediaSession.setActionHandler("previoustrack", playPrev);
      navigator.mediaSession.setActionHandler("nexttrack", playNext);
    }catch(e){}
  }

  // Whether tapping `id` should (re)load it into the player, vs. just
  // toggling play/pause on what's already loaded. True for a different
  // episode, AND for the current one if it was never actually loaded this
  // session (e.g. right after reopening the app) or its load failed.
  function shouldLoad(id){
    return id !== currentId || (!audioLoaded && !loading);
  }

  function playEpisode(id){
    var ep = byId[id];
    if(!ep) return;

    if(currentId && currentId !== id) persistPosition(true);

    currentId = id;
    audioLoaded = false;
    loading = true;
    loadToken++;
    var myToken = loadToken;

    lsSet("mahagita:lastPlayed", currentId);
    $player.classList.add("show");
    $title.textContent = ep.name;
    $time.textContent = "Loading…";
    setPlayButtonState("loading");
    updateMediaSession(ep);
    render();

    if(myToken !== loadToken) return; // superseded by a newer tap elsewhere

    $audio.src = ep.url;
    $audio.playbackRate = rates[rateIdx];
    $rateBtn.textContent = rates[rateIdx] + "×";

    var resumeAt = ep.position || 0;
    var seeked = false;

    function onMeta(){
      if(myToken !== loadToken) return;
      audioLoaded = true;
      loading = false;
      $audio.removeEventListener("error", onError);
      if(!seeked && resumeAt > 0 && resumeAt < ($audio.duration - 2 || Infinity)){
        seeked = true;
        $audio.currentTime = resumeAt;
      }
      render();
    }
    function onError(){
      if(myToken !== loadToken) return;
      audioLoaded = false;
      loading = false;
      $audio.removeEventListener("loadedmetadata", onMeta);
      $time.textContent = "Couldn't load — tap to retry";
      setPlayButtonState("play");
      render();
    }

    $audio.addEventListener("loadedmetadata", onMeta, { once:true });
    $audio.addEventListener("error", onError, { once:true });

    // Call play() itself, not load(): with preload="none" nothing starts
    // fetching until playback is requested, so waiting for loadedmetadata
    // before calling play() would deadlock forever (this was the actual
    // bug — the player looked like it remembered the position but could
    // never start, because it was waiting on an event that never fires).
    // Seeking to the resume position happens moments later once
    // loadedmetadata does fire, above. Calling play() synchronously here
    // (not after an async lookup) also keeps this tied to your tap, which
    // iOS Safari requires for autoplay to be allowed at all.
    $audio.play().catch(function(){
      setPlayButtonState("play");
    });
  }

  var lastSaveAt = 0;
  var SAVE_INTERVAL_MS = 2000;

  function persistPosition(immediate){
    // Only save when this session actually has real playback state for
    // currentId — otherwise (e.g. the app was restored to a remembered
    // episode but never tapped before being closed again) $audio.currentTime
    // is just 0 from an empty player, and saving it would silently wipe out
    // a real saved position from a previous session.
    if(!currentId || !audioLoaded) return;
    var ep = byId[currentId];
    if(!ep) return;
    var pos = $audio.currentTime || 0;
    var dur = $audio.duration || ep.duration || 0;
    ep.position = pos;
    if(dur) ep.duration = dur;
    ep.done = dur > 0 && pos >= dur - 3;

    if(immediate){
      clearTimeout(saveTimer);
      saveTimer = null;
      saveProgress(ep);
      lastSaveAt = Date.now();
      return;
    }

    // Throttled (not debounced): timeupdate fires several times a second
    // during playback, so a plain debounce that resets on every call would
    // never actually elapse and nothing would get saved until pause/close.
    var now = Date.now();
    var elapsed = now - lastSaveAt;
    if(elapsed >= SAVE_INTERVAL_MS){
      saveProgress(ep);
      lastSaveAt = now;
    } else if(!saveTimer){
      saveTimer = setTimeout(function(){
        saveTimer = null;
        saveProgress(ep);
        lastSaveAt = Date.now();
      }, SAVE_INTERVAL_MS - elapsed);
    }
  }

  $audio.addEventListener("timeupdate", function(){
    if($audio.duration){
      $seek.max = $audio.duration;
      $seek.value = $audio.currentTime;
      $time.textContent = fmtTime($audio.currentTime) + " / " + fmtTime($audio.duration);
      if("mediaSession" in navigator && navigator.mediaSession.setPositionState){
        try{
          navigator.mediaSession.setPositionState({
            duration: $audio.duration,
            playbackRate: $audio.playbackRate,
            position: $audio.currentTime
          });
        }catch(e){}
      }
    }
    persistPosition(false);
    updateRowProgress();
  });

  $audio.addEventListener("play", function(){
    setPlayButtonState("pause");
    $playPause.setAttribute("aria-label","Pause");
    if("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  });
  $audio.addEventListener("pause", function(){
    setPlayButtonState("play");
    $playPause.setAttribute("aria-label","Play");
    if("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    persistPosition(true);
  });
  $audio.addEventListener("ended", function(){
    persistPosition(true);
    render();
    playNext();
  });

  function updateRowProgress(){
    if(!currentId || !$audio.duration) return;
    var row = $list.querySelector('li[data-id="'+cssEscape(currentId)+'"] .mini-fill');
    if(row){
      var pct = Math.min(100, ($audio.currentTime/$audio.duration)*100);
      row.style.width = pct.toFixed(1) + "%";
    }
    var timeEl = $list.querySelector('li[data-id="'+cssEscape(currentId)+'"] .ep-meta span:first-child + span');
    if(timeEl){ timeEl.textContent = fmtTime($audio.currentTime); }
  }
  function cssEscape(s){
    return String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function playNext(){
    var idx = episodes.findIndex(function(e){ return e.id === currentId; });
    if(idx >= 0 && idx < episodes.length - 1) playEpisode(episodes[idx+1].id);
  }
  function playPrev(){
    var idx = episodes.findIndex(function(e){ return e.id === currentId; });
    if(idx > 0) playEpisode(episodes[idx-1].id);
  }

  $playPause.addEventListener("click", function(){
    var target = byId[currentId] || episodes[0];
    if(shouldLoad(target.id)){ playEpisode(target.id); return; }
    if(!audioLoaded) return; // already loading this one; ignore extra taps
    if($audio.paused){ $audio.play().catch(function(){}); }
    else { $audio.pause(); }
  });

  document.getElementById("backBtn").addEventListener("click", function(){
    $audio.currentTime = Math.max(0, $audio.currentTime - 15);
  });
  document.getElementById("fwdBtn").addEventListener("click", function(){
    $audio.currentTime = Math.min($audio.duration || Infinity, $audio.currentTime + 30);
  });
  $seek.addEventListener("input", function(){
    $audio.currentTime = parseFloat($seek.value);
  });
  $rateBtn.addEventListener("click", function(){
    rateIdx = (rateIdx + 1) % rates.length;
    lsSet("mahagita:rateIdx", rateIdx);
    $audio.playbackRate = rates[rateIdx];
    $rateBtn.textContent = rates[rateIdx] + "×";
  });

  // jump straight to the last-played episode and scroll it into view
  $jumpBtn.addEventListener("click", function(){
    var target = byId[currentId] || episodes[0];
    var row = $list.querySelector('li[data-id="'+cssEscape(target.id)+'"]');
    if(row) row.scrollIntoView({ behavior:"smooth", block:"center" });
    if(shouldLoad(target.id)){ playEpisode(target.id); return; }
    if(audioLoaded && $audio.paused) $audio.play().catch(function(){});
  });

  // ---------- list interactions ----------
  $list.addEventListener("click", function(e){
    var li = e.target.closest("li.ep");
    if(li){
      var epId = li.getAttribute("data-id");
      if(shouldLoad(epId)){ playEpisode(epId); return; }
      if(!audioLoaded) return; // already loading this one; ignore extra taps
      if($audio.paused) $audio.play().catch(function(){});
      else $audio.pause();
    }
  });

  // ---------- online/offline awareness ----------
  function updateNetNote(){
    $netNote.classList.toggle("show", !navigator.onLine);
  }
  window.addEventListener("online", updateNetNote);
  window.addEventListener("offline", updateNetNote);

  updateNetNote();
  render();

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") persistPosition(true);
  });
  window.addEventListener("pagehide", function(){ persistPosition(true); });

})();
</script>
</body>
</html>
