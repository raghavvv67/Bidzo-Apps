<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline CRM</title>
  <style>
    :root { --ink:#17233c; --muted:#68758d; --line:#e6eaf0; --bg:#f5f7fb; --brand:#315efb; --card:#fff; }
    * { box-sizing:border-box } body { margin:0; font:14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; color:var(--ink); background:var(--bg) }
    header { background:#17233c; color:#fff; padding:22px 32px; display:flex; gap:20px; align-items:center; justify-content:space-between }
    h1 { font-size:20px; margin:0; letter-spacing:-.3px } .sub { opacity:.65; font-size:12px; margin-top:2px }
    button, .file-label { border:0; border-radius:8px; background:var(--brand); color:#fff; padding:9px 13px; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:7px }
    button.secondary, .file-label.secondary { background:#fff; color:var(--ink); border:1px solid #d7ddea } button.danger { background:#fff0f0; color:#b42318 }
    main { padding:26px 32px; max-width:1600px; margin:auto }.toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; align-items:center }
    input, select, textarea { font:inherit; border:1px solid #d7ddea; border-radius:8px; padding:9px 10px; color:var(--ink); background:white }
    #search { min-width:250px; flex:1 }.stats { display:grid; grid-template-columns:repeat(5,minmax(135px,1fr)); gap:12px; margin-bottom:20px }
    .stat { background:var(--card); border:1px solid var(--line); padding:15px; border-radius:10px; cursor:pointer }.stat b { display:block; font-size:23px; margin-top:3px }.stat small { color:var(--muted) }
    .hint { color:var(--muted); font-size:12px }.board { display:grid; grid-template-columns:repeat(9,minmax(220px,1fr)); gap:14px; overflow-x:auto; align-items:start; padding-bottom:12px }.column { background:#e9edf5; border-radius:11px; min-height:430px; padding:10px; transition:.15s }.column.over { background:#dbe5ff; outline:2px dashed #315efb }.column-head{display:flex;justify-content:space-between;align-items:center;padding:4px 3px 11px;font-weight:700}.count{background:#d7deed;color:#52617b;border-radius:12px;padding:1px 7px;font-size:12px}.lead-list{min-height:365px;display:grid;gap:9px;align-content:start}.lead-card{background:#fff;border-radius:9px;padding:12px;box-shadow:0 1px 2px #192b4a12;cursor:grab;border:1px solid #e3e7ef}.lead-card:active{cursor:grabbing}.lead-card.dragging{opacity:.45}.card-top{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:5px}.lead-card h3{font-size:14px;margin:0;color:#203eac}.lead-card p{margin:3px 0;color:#52617b;font-size:12px}.rep-avatar{width:34px;height:34px;flex:none;border-radius:50%;background:#fbb5c9;color:#452333;display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:-.3px}.assign{background:#315efb;color:#fff;border:0;border-radius:6px;padding:5px 7px;font-size:11px;cursor:pointer}.card-footer{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.empty-col{color:#7d899e;font-size:12px;text-align:center;padding:24px 6px;border:1px dashed #cbd3e1;border-radius:8px}.empty { text-align:center; padding:52px; color:var(--muted) }
    dialog { border:0; border-radius:14px; padding:0; width:min(620px, calc(100% - 32px)); box-shadow:0 16px 60px #17233c55 } dialog::backdrop { background:#17233c88 }.modal-head { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center }.modal-head h2{margin:0;font-size:18px}.modal-body{padding:20px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label,.comment-box label { display:grid; gap:5px; color:var(--muted); font-size:12px }.grid input,.grid select{width:100%}.modal-actions{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.comments { margin-top:22px; border-top:1px solid var(--line); padding-top:16px }.comment { padding:10px 0; border-bottom:1px solid var(--line) }.comment-meta { color:var(--muted); font-size:12px; margin-bottom:3px }.comment-box { margin-top:13px }.comment-box textarea{width:100%; min-height:68px; resize:vertical} .close{background:transparent;color:var(--muted);font-size:20px;padding:2px 7px} #csv{display:none}@media(max-width:700px){header,main{padding-left:16px;padding-right:16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><h1>Pipeline CRM</h1><div class="sub">A simple shared-sales workflow</div></div><button class="secondary" onclick="openNewLead()">+ Add lead</button></header>
  <main>
    <div class="toolbar"><input id="search" placeholder="Search name, phone, company, salesperson…" oninput="render()"/><select id="filterStatus" onchange="render()"><option value="">All statuses</option></select><select id="filterOwner" onchange="render()"><option value="">All salespeople</option></select><label class="file-label secondary" for="csv">Import CSV</label><input id="csv" type="file" accept=".csv,text/csv" onchange="importCSV(event)"/><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="secondary" onclick="loadDemo()">Load example leads</button></div>
    <div class="hint" id="importHint">Import a regular or Meta lead CSV. Name, sales rep, brand, phone, email, and status go on the card; every other answer is saved as a comment.</div>
    <section class="stats" id="stats"></section><div class="board" id="board"></div><div class="empty" id="empty">No leads yet. Add one or import your CSV to get started.</div>
  </main>
  <dialog id="leadDialog"><form method="dialog" id="leadForm"><div class="modal-head"><h2 id="dialogTitle">Lead details</h2><button class="close" value="cancel" aria-label="Close">×</button></div><div class="modal-body"><div class="grid"><label>Name<input name="name" required /></label><label>Phone<input name="phone" /></label><label>Email<input name="email" type="email" /></label><label>Brand name<input name="company" /></label><label>Salesperson<input name="owner" placeholder="e.g. Priya" /></label><label>Status<select name="status"></select></label></div><div class="comments"><strong>Comments & activity</strong><div id="commentList"></div><div class="comment-box"><label>New comment<textarea id="newComment" placeholder="Add a note, call outcome, or next step…"></textarea></label><button type="button" onclick="addComment()" style="margin-top:8px">Add comment</button></div></div></div><div class="modal-actions"><button class="danger" type="button" id="deleteBtn" onclick="deleteLead()">Delete</button><button class="secondary" value="cancel">Cancel</button><button type="button" onclick="saveLead()">Save changes</button></div></form></dialog>
  <script>
    const STATUSES=['Incoming leads','New leads','P1','P2','Call not answered','Follow up later','Audit booked','Junk','Lost'];
    let leads=JSON.parse(localStorage.getItem('pipeline-crm-leads')||'[]'), activeId=null;
    const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])), initials=s=>String(s||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?';
    function save(){localStorage.setItem('pipeline-crm-leads',JSON.stringify(leads))}
    function date(v){return v?new Date(v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—'}
    function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
    function statusOptions(selected){return STATUSES.map(s=>`<option ${s===selected?'selected':''}>${s}</option>`).join('')}
    function refreshFilters(){let owners=[...new Set(leads.map(l=>l.owner).filter(Boolean))].sort(), old=$('#filterOwner').value, oldStatus=$('#filterStatus').value; $('#filterStatus').innerHTML='<option value="">All statuses</option>'+STATUSES.map(s=>`<option ${s===oldStatus?'selected':''}>${s}</option>`).join(''); $('#filterOwner').innerHTML='<option value="">All salespeople</option>'+owners.map(x=>`<option ${x===old?'selected':''}>${esc(x)}</option>`).join('')}
    function render(){refreshFilters();let q=$('#search').value.toLowerCase(), st=$('#filterStatus').value, ow=$('#filterOwner').value;let shown=leads.filter(l=>!st||l.status===st).filter(l=>!ow||l.owner===ow).filter(l=>!q||[l.name,l.phone,l.email,l.company,l.owner,l.status].join(' ').toLowerCase().includes(q));$('#stats').innerHTML=STATUSES.map(s=>`<div class="stat" onclick="$('#filterStatus').value='${s}';render()"><small>${s}</small><b>${leads.filter(l=>l.status===s).length}</b></div>`).join('');$('#board').innerHTML=STATUSES.map(s=>{let cards=shown.filter(l=>l.status===s);return `<section class="column" data-status="${s}" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dropLead(event,'${s}')"><div class="column-head"><span>${s}</span><span class="count">${cards.length}</span></div><div class="lead-list">${cards.length?cards.map(card).join(''):'<div class="empty-col">Drag leads here</div>'}</div></section>`}).join('');$('#empty').style.display=leads.length?'none':'block'}
    function card(l){let rep=l.owner||'Unassigned', assignment=l.status==='Incoming leads'?`<button class="assign" onclick="event.stopPropagation();assignToRep('${l.id}')">Assign to sales rep</button>`:'<span>Click for details</span>';return `<article class="lead-card" draggable="true" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" onclick="openLead('${l.id}')"><div class="card-top"><h3>${esc(l.name)}</h3><span class="rep-avatar" title="Sales rep: ${esc(rep)}" aria-label="Sales rep: ${esc(rep)}">${initials(rep)}</span></div><p><strong>Brand:</strong> ${esc(l.company||'—')}</p><p><strong>Phone:</strong> ${esc(l.phone||'—')}</p><p><strong>Email:</strong> ${esc(l.email||'—')}</p><div class="card-footer">${assignment}<span>${l.comments?.length||0} comments</span></div></article>`}
    function dragStart(e,x){e.dataTransfer.setData('text/plain',x);e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging')}function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.column').forEach(x=>x.classList.remove('over'))}function allowDrop(e){e.preventDefault();e.dataTransfer.dropEffect='move'}function dragEnter(e){e.preventDefault();e.currentTarget.closest('.column').classList.add('over')}function dragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.closest('.column').classList.remove('over')}function dropLead(e,status){e.preventDefault();let x=e.dataTransfer.getData('text/plain'),l=leads.find(l=>l.id===x);if(l&&l.status!==status){l.status=status;l.updatedAt=new Date().toISOString();save()}e.currentTarget.closest('.column').classList.remove('over');render()}
    function openNewLead(){activeId=null;$('#dialogTitle').textContent='Add lead';$('#leadForm').reset();$('#leadForm [name=status]').innerHTML=statusOptions(STATUSES[0]);$('#leadForm [name=status]').disabled=true;$('#commentList').innerHTML='';$('#deleteBtn').style.display='none';$('#leadDialog').showModal()}
    function openLead(x){let l=leads.find(l=>l.id===x);if(!l)return;activeId=x;$('#dialogTitle').textContent='Lead details';for(let k of ['name','phone','email','company','owner'])$('#leadForm [name='+k+']').value=l[k]||'';$('#leadForm [name=status]').innerHTML=statusOptions(l.status);$('#leadForm [name=status]').disabled=false;$('#newComment').value='';$('#deleteBtn').style.display='block';renderComments(l);$('#leadDialog').showModal()}
    function renderComments(l){$('#commentList').innerHTML=(l.comments||[]).length?(l.comments||[]).slice().reverse().map(c=>`<div class="comment"><div class="comment-meta">${esc(c.author||'Team')} · ${date(c.at)}</div>${esc(c.text)}</div>`).join(''):'<p class="hint">No comments yet.</p>'}
    function saveLead(){let f=new FormData($('#leadForm')), data=Object.fromEntries(f.entries()), now=new Date().toISOString(); if(activeId){let l=leads.find(l=>l.id===activeId);Object.assign(l,data,{updatedAt:now})}else{data.status=STATUSES[0];leads.unshift({...data,id:id(),comments:[],createdAt:now,updatedAt:now})}save();$('#leadDialog').close();render()}
    function quickStatus(x,v){let l=leads.find(l=>l.id===x);l.status=v;l.updatedAt=new Date().toISOString();save();render()}function assignToRep(x){let l=leads.find(l=>l.id===x),rep=prompt('Assign this lead to a sales rep:',l.owner||'');if(!rep||!rep.trim())return;l.owner=rep.trim();l.status='New leads';l.updatedAt=new Date().toISOString();save();render()}
    function addComment(){let text=$('#newComment').value.trim();if(!text)return;let l=leads.find(l=>l.id===activeId);l.comments=l.comments||[];l.comments.push({text,author:l.owner||'Team',at:new Date().toISOString()});l.updatedAt=new Date().toISOString();$('#newComment').value='';save();renderComments(l);render()}
    function deleteLead(){if(activeId&&confirm('Delete this lead?')){leads=leads.filter(l=>l.id!==activeId);save();$('#leadDialog').close();render()}}
    function norm(h){return h.toLowerCase().trim().replace(/[^a-z]/g,'')};function importCSV(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let lines=reader.result.replace(/\r/g,'').split('\n').filter(Boolean), parse=s=>{let a=[],v='',q=false;for(let i=0;i<s.length;i++){if(s[i]=='"'){if(q&&s[i+1]=='"'){v+='"';i++}else q=!q}else if(s[i]==','&&!q){a.push(v.trim());v=''}else v+=s[i]}a.push(v.trim());return a}, rawHeaders=parse(lines.shift()), headers=rawHeaders.map(norm), get=(r,...names)=>{let i=headers.findIndex(h=>names.includes(h));return i<0?'':r[i]||''}, topFields=new Set(['name','leadname','fullname','firstname','customername','clientname','contactname','phone','phonenumber','mobilenumber','mobile','contact','contactnumber','email','emailaddress','company','companyname','brand','brandname','business','salesperson','salesrep','owner','assignee','assignedto']), added=0;for(let line of lines){let r=parse(line), name=get(r,'name','leadname','fullname','firstname','customername','clientname','contactname');if(!name)continue;let extraAnswers=r.map((value,i)=>!topFields.has(headers[i])&&value?`${rawHeaders[i]}: ${value}`:'').filter(Boolean);let now=new Date().toISOString(), metaComment=extraAnswers.length?`Meta lead details\n${extraAnswers.join('\n')}`:'';leads.push({id:id(),name,phone:get(r,'phone','phonenumber','mobilenumber','mobile','contact','contactnumber'),email:get(r,'email','emailaddress'),company:get(r,'company','companyname','brand','brandname','business'),owner:'',status:STATUSES[0],comments:metaComment?[{text:metaComment,author:'Meta import',at:now}]:[],createdAt:now,updatedAt:now});added++}save();$('#importHint').textContent=`Imported ${added} leads into Incoming leads. Assign each one to a sales rep when ready.`;e.target.value='';render()};reader.readAsText(file)}
    function csv(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}function exportCSV(){let text=['name,phone,email,company,salesperson,status,comments',...leads.map(l=>[l.name,l.phone,l.email,l.company,l.owner,l.status,(l.comments||[]).map(c=>c.text).join(' | ')].map(csv).join(','))].join('\n'), a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='pipeline-leads.csv';a.click();URL.revokeObjectURL(a.href)}
    function loadDemo(){if(leads.length&&!confirm('Add example leads to your existing data?'))return;let samples=[['Ananya Shah','+91 98765 41022','ananya@northstar.in','Northstar Logistics','Ravi','New leads'],['Vikram Mehta','+91 98765 61810','vikram@acme.co','Acme Retail','Priya','P1'],['Neha Kapoor','+91 98765 92145','neha@weave.in','Weave Studio','Ravi','Follow up later']];for(let [name,phone,email,company,owner,status] of samples){let now=new Date().toISOString();leads.push({id:id(),name,phone,email,company,owner,status,comments:[],createdAt:now,updatedAt:now})}save();render()}
    render();
  </script>
</body></html>
